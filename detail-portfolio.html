    <title>Detailed Portfolio - Taimoor's Portfolio</title>
    
    <style>
        /* Detail Portfolio Page Specific Styles */
        .detail-portfolio-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            background: var(--body-color);
        }

        .detail-portfolio-icon {
            font-size: 6rem;
            color: var(--first-color);
            margin-bottom: 2rem;
        }

        .detail-portfolio-title {
            font-size: var(--biggest-font-size);
            color: var(--first-color);
            margin-bottom: 1rem;
        }

        .detail-portfolio-subtitle {
            font-size: var(--h2-font-size);
            color: var(--title-color);
            margin-bottom: 2rem;
        }

        .detail-portfolio-description {
            font-size: var(--normal-font-size);
            color: var(--text-color);
            max-width: 600px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .detail-portfolio-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 2rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--first-color);
            color: var(--title-color);
            border-radius: 0.5rem;
            font-weight: var(--font-medium);
            transition: 0.3s;
        }

        .back-button:hover {
            background: var(--first-color-alt);
            transform: translateY(-2px);
        }

        .home-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: transparent;
            color: var(--first-color);
            border: 2px solid var(--first-color);
            border-radius: 0.5rem;
            font-weight: var(--font-medium);
            transition: 0.3s;
        }

        .home-button:hover {
            background: var(--first-color);
            color: var(--title-color);
        }

        /* Responsive */
        @media screen and (max-width: 768px) {
            .detail-portfolio-icon {
                font-size: 4rem;
            }

            .detail-portfolio-title {
                font-size: var(--h1-font-size);
            }
        }
    </style>
</head>

<body>
    <!--=============== HEADER ===============-->
    <header class="header" id="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo">Taimoor Asif</a>

            <div class="nav__menu">
                <ul class="nav__list">
                    <li class="nav__item">
                        <a href="index.html" class="nav__link">
                            <i class='bx bx-home'></i>
                        </a>
                    </li>

                    <li class="nav__item">
                        <a href="index.html#about" class="nav__link">
                            <i class='bx bx-user'></i>
                        </a>
                    </li>

                    <li class="nav__item">
                        <a href="index.html#skills" class="nav__link">
                            <i class='bx bx-book'></i>
                        </a>
                    </li>

                    <li class="nav__item">
                        <a href="index.html#work" class="nav__link">
                            <i class='bx bx-briefcase-alt-2'></i>
                        </a>
                    </li>
                    
                    <li class="nav__item">
                        <a href="index.html#contact" class="nav__link">
                            <i class='bx bx-message-square-dots'></i>
                        </a>
                    </li>

                    <li class="nav__item">
                        <a href="detail-portfolio.html" class="nav__link active-link">
                            <i class='bx bx-layer'></i>
                        </a>
                    </li>
                </ul>
            </div>

            <!--=============== theme change button ===============-->
            <i class='bx bx-moon change-theme change-theme-button' id="theme-button"></i>

        </nav>
    </header>

    <div class="detail-portfolio-container" style="padding-top: 5rem;">
        <i class='bx bx-folder-open detail-portfolio-icon'></i>

        <h1 class="detail-portfolio-title">Detailed Portfolio</h1>
        <h2 class="detail-portfolio-subtitle">Coming Soon</h2>

        <p class="detail-portfolio-description">
            This page will showcase detailed project case studies, design processes, and comprehensive portfolio information. Check back soon for updates!
        </p>

        <div class="detail-portfolio-buttons">
            <a href="index.html" class="back-button">
                <i class='bx bx-arrow-back'></i>
                Back to Home
            </a>
            <a href="index.html#work" class="home-button">
                <i class='bx bx-briefcase-alt-2'></i>
                View Projects
            </a>
        </div>
    </div>

    <!--=============== MAIN JS ===============-->
    <script src="assets/js/main.js"></script>
</body>
